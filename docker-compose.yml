services:
  floci-ui:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./packages/frontend/src:/app/src
      - ./packages/frontend/index.html:/app/index.html
      - ./packages/frontend/vite.config.ts:/app/vite.config.ts
      - ./packages/frontend/tsconfig.json:/app/tsconfig.json
      - ./packages/frontend/tsconfig.node.json:/app/tsconfig.node.json
    ports:
      - "4500:4500"
    environment:
      API_TARGET: http://floci-api:4501
      VITE_USE_POLLING: "true"
    depends_on:
      - floci-api
    restart: unless-stopped
    networks:
      - floci_default

  floci-api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile.dev
    volumes:
      - ./packages/api/src:/app/src
    ports:
      - "4501:4501"
    environment:
      # Custom env-variable from our Azure-only change
      FLOCI_ENABLED_CLOUDS: azure

      # Floci AZ
      FLOCI_AZURE_ENDPOINT: http://floci-az:4577
      FLOCI_AZURE_ACCOUNT_NAME: devstoreaccount1

      PORT: "4501"

    depends_on:
      - floci-az
    restart: unless-stopped
    networks:
      - floci_default

  floci-az:
    image: floci/floci-az:latest
    ports:
      - "4577:4577"

    volumes:
      # Persist Floci AZ state
      - ./data/floci-az:/app/data

      # Required because Azure PostgreSQL instances
      # are spawned as separate Docker containers
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # --------------------------------------------------
      # General Floci AZ configuration
      # --------------------------------------------------

      FLOCI_AZ_STORAGE_MODE: hybrid
      FLOCI_AZ_STORAGE_PATH: /app/data

      # Sidecar containers should join the same Docker network
      FLOCI_AZ_SERVICES_DOCKER_NETWORK: floci_default

      FLOCI_AZ_HOSTNAME: floci-az

      # --------------------------------------------------
      # Azure Database for PostgreSQL
      # --------------------------------------------------

      FLOCI_AZ_SERVICES_POSTGRES_ENABLED: "true"

      # We want an actual PostgreSQL container,
      # not management-plane-only emulation
      FLOCI_AZ_SERVICES_POSTGRES_MOCKED: "false"

      # PostgreSQL 18 + PostGIS 3.6
      FLOCI_AZ_SERVICES_POSTGRES_IMAGE: imresamu/postgis-arm64:18-3.6-alpine

      # Give PostGIS/PostgreSQL some time to start
      FLOCI_AZ_SERVICES_POSTGRES_STARTUP_TIMEOUT_SECONDS: "60"

    restart: unless-stopped
    networks:
      - floci_default

networks:
  floci_default:
    name: floci_default
